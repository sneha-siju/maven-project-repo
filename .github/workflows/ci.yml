name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Automated Test Suites
        run: mvn -B clean test

      - name: Package Executable Distribution
        run: mvn -B package -DskipTests

      - name: Upload Build Artifact for Verification
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar
          path: target/*.jar
          retention-days: 5

  deploy-production:
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-ready-jar
          path: target

      - name: Deploy to Production Environment
        run: |
          echo "CI tests passed. Deploying to Production..."
          docker compose up -d --force-recreate
